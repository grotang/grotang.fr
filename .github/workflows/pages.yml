name: Publication GitHub Pages

# Netlify facturait 15 crédits par déploiement, soit 20 par mois sur son offre
# gratuite — et coupait la publication au-delà. Un site dont la raison d'être est
# de se republier deux fois par jour ne tient pas dans ce budget. GitHub Pages ne
# compte pas les déploiements pour un dépôt public.
#
# Le site est FABRIQUÉ ici, à partir des sources : `public/` n'est plus dans le
# dépôt. Avant, le robot et nous déposions tous les deux les mêmes fichiers
# fabriqués, et git ne savait pas les fusionner. Maintenant chacun ne touche
# qu'aux sources, et la page finie n'existe que le temps d'une publication.

on:
  push:
    branches: [main]
    paths:
      # Un commit qui ne touche pas le site publié ne déclenche pas de publication :
      # le signe de vie mensuel, une correction d'outillage, une note dans le README.
      # C'est la règle qu'on avait déjà chez Netlify, conservée ici par hygiène —
      # elle ne coûte plus rien mais évite un déploiement qui ne change rien.
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Droits minimaux exigés par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; si deux commits arrivent coup sur coup, seule la
# dernière version part — inutile de publier un état déjà périmé.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Historique complet : la date de chaque page dans le sitemap est celle du
      # dernier commit qui a touché ses sources.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fabriquer le site
        run: node tools/build.mjs

      # La carte de partage (og:image) se photographie dans un vrai navigateur.
      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Carte de partage
        run: node tools/uefa/carte.mjs

      - uses: actions/configure-pages@v5

      # Le domaine personnalisé est déclaré par un fichier CNAME servi à la racine.
      # Il est écrit ici, après la fabrication : tools/build.mjs vide public/.
      - name: Déclarer le domaine
        run: echo 'grotang.fr' > public/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
