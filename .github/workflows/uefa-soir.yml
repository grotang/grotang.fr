name: Soir de match UEFA

# LA VEILLE DU SOIR DE MATCH.
#
# Les tâches planifiées de GitHub ne partent pas à l'heure : le 13/10/2026, le
# passage prévu à 23 h 38 est parti à 2 h 33, celui de 16 h à 20 h 53. GitHub
# l'écrit lui-même : en période de charge, les départs sont retardés, voire
# sautés. Aucun réglage de l'heure ne règle ça.
#
# Donc on ne vise plus une heure : on part TÔT et on reste éveillé. Deux départs
# dans l'après-midi (le second rattrape le premier s'il est sauté). Si ce n'est
# pas un soir de match, la tâche s'arrête en quelques secondes. Sinon elle attend
# 20 h 35 (Paris), puis toutes les dix minutes relit la source et Wikipédia,
# dépose et publie dès qu'il y a du neuf — le score du match de 18 h 45 apparaît
# vers 20 h 45, celui de 21 h vers 23 h — et s'arrête quand tout est à jour
# (source datée du soir ET score de tous les matchs du soir sur Wikipédia), au
# plus tard à 3 h 30. Même partie avec trois heures de retard, elle couvre la
# soirée. Les passages du matin (uefa.yml) restent en filet.
#
# Coût : rien. Les minutes de GitHub Actions sont gratuites pour un dépôt public,
# y compris celles où la tâche attend.
#
#   47 16 UTC → 18 h 47 été · 17 h 47 hiver
#   47 17 UTC → 19 h 47 été · 18 h 47 hiver
#   47 19 UTC → 21 h 47 été · 20 h 47 hiver   (dernier départ, en filet)
#
# LE DÉPART DE 17 H 47 (depuis le 30/10/2026). Du 14 au 29/10, le départ prévu
# à 18 h 47 (19 h 47 en été) est parti en moyenne avec 3 h de retard, jusqu'à
# 4 h 12 : la veille démarrait vers 22 h 45 et le score du match de 18 h 45
# n'apparaissait qu'après 23 h. Une heure plus tôt, avec le même retard, la veille
# démarre entre 19 h 47 et 21 h 47. Parti à l'heure, il attend 20 h 35 et
# s'arrête à 23 h 27 (5 h 40 après son départ réel) : la source, à jour vers
# 23 h 10, est attrapée ; s'il manque un score, le départ suivant, qui attend
# derrière lui, prend le relais. Plus tôt, un départ à l'heure s'arrêterait
# avant la mise à jour de la source.
#
# SEULEMENT LES SOIRS POSSIBLES (depuis le 30/10/2026). Avant : tous les jours,
# 730 départs par an pour environ 80 soirs de match. Le calendrier 2026/27 :
# 78 soirs, tous mardi, mercredi ou jeudi, sauf la finale de la Ligue des
# champions (samedi). D'où mardi → jeudi toute l'année, plus le samedi en mai et
# juin. Le test « Ce soir, y a-t-il match ? » reste en place : un mardi sans
# match, la tâche s'arrête toujours en quelques secondes.
# Si l'UEFA programme un jour un soir hors de ces cases, le passage du
# lendemain matin (uefa.yml) ne le rattrapera pas non plus : ajouter le jour ici
# ET dans uefa.yml.
#
# Lancée à la main (bouton « Run workflow ») : un tour tout de suite, puis la
# veille continue si c'est un soir de match.
#
# LE RÉVEIL EXTERNE (depuis le 04/11/2026). Mesuré du 14/10 au 04/11 : les
# départs planifiés partent avec 2 à 5 h de retard le soir (jusqu'à 10 h pour
# d'autres robots), et depuis le 30/10 GitHub en saute purement et simplement
# (le 03/11 : un seul des trois départs prévus, à 23 h 04). Un lancement par
# l'API, lui, part dans la seconde. cron-job.org appelle donc ce robot chaque
# jour à 20 h 40 et 22 h 50 (Paris), avec auto = true : le test « y a-t-il
# match ? » s'applique, un soir sans match coûte quelques secondes. Le jeton
# utilisé ne sait que lancer les robots de ce dépôt. Les départs planifiés
# ci-dessous restent en filet.
#
# Une ligne par heure (04/11) : avant le 30/10, une ligne par heure et aucun
# départ sauté sur 32 ; depuis le passage à « 16,17,19 » sur une seule ligne,
# 3 créneaux sur 5 sautés. Pas prouvé que ce soit la cause : on revient à ce qui
# marchait.
on:
  schedule:
    - cron: '47 16 * * 2-4'   # mardi → jeudi
    - cron: '47 17 * * 2-4'
    - cron: '47 19 * * 2-4'
    - cron: '47 16 * 5,6 6'   # samedi, en mai et juin (finale de C1)
    - cron: '47 17 * 5,6 6'
    - cron: '47 19 * 5,6 6'
  workflow_dispatch:
    inputs:
      auto:
        description: 'Appel du réveil externe : ne travaille que les soirs de match'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Même file que le rafraîchissement du matin : jamais deux robots à la fois sur
# page.html. Le second départ attend la fin du premier, constate que tout est à
# jour, et s'arrête.
concurrency:
  group: uefa-refresh
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Ce soir, y a-t-il match ?
        id: match
        run: |
          # lancée à la main : on y va dans tous les cas (au moins un tour tout de suite) ;
          # appelée par le réveil externe (auto) : seulement un soir de match
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; } || node tools/uefa/soir.mjs match; then echo "oui=true" >> "$GITHUB_OUTPUT"; else echo "oui=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.match.outputs.oui == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.match.outputs.oui == 'true'
        run: npm ci

      - name: Navigateur
        if: steps.match.outputs.oui == 'true'
        timeout-minutes: 8
        run: bash tools/navigateur.sh

      # La boucle. Chaque tour : relire (source + Wikipédia) ; s'il y a du neuf,
      # fabriquer, projeter, tester, déposer, publier ; puis se demander si tout
      # est à jour. Un tour raté (source injoignable, test rouge) n'arrête pas la
      # veille : on retente dix minutes plus tard, rien de cassé n'est publié.
      - name: Veiller jusqu'à ce que tout soit à jour
        if: steps.match.outputs.oui == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git config user.name  "grotang.fr (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fin=$(( $(date +%s) + 340*60 ))
          tour() {
            git pull --rebase --quiet || true
            node tools/uefa/refresh.mjs || { echo "relecture en échec, on retentera"; return; }
            if [ -z "$(git status --porcelain)" ]; then echo "rien de neuf"; return; fi
            neuf=true
            node tools/build.mjs && node tools/uefa/projette.mjs 200000 && node tools/uefa/test-page.mjs public/uefa/index.html \
              || { echo "fabrication ou test en échec : rien n'est déposé"; git checkout -- . ; git clean -fdq tools; return; }
            STAND=$(node -p "JSON.parse(require('fs').readFileSync('tools/uefa/page.html','utf8').split('/*DATA_START*/')[1].split('/*DATA_END*/')[0].replace(/^const D\s*=\s*/,'').replace(/;\s*$/,'')).meta.lastUpdated")
            if git diff --quiet HEAD -- tools/uefa/nations.json; then MSG="Soir de match : scores Wikipédia (source arrêtée au $STAND)"; else MSG="Coefficient UEFA : source arrêtée au $STAND"; fi
            git add -A && git commit -qm "$MSG" && { git push || { git pull --rebase && git push; }; } \
              && gh workflow run pages.yml --ref main && echo "Déposé et publié : $MSG"
          }
          # lancée à la main : un premier tour tout de suite, sans attendre 20 h 35
          premier=${{ github.event_name == 'workflow_dispatch' }}
          # RONDE DE CONFIRMATION (05/11/2026). La source publie parfois une seconde
          # version quelques minutes après la première (22/10 : 22 h 58 puis 23 h 04 ;
          # 04/11 : 22 h 56 puis 23 h 03, le nul de Rennes manquait à la première).
          # « Tout est à jour » ne suffit donc plus : on refait un tour dix minutes
          # plus tard et on ne s'arrête que si ce tour n'a rien apporté.
          confirme=false
          while :; do
            if [ "$premier" != true ] && node tools/uefa/soir.mjs tot; then sleep 300; [ $(date +%s) -ge $fin ] && break; continue; fi
            premier=false
            echo "── $(TZ=Europe/Paris date +%H:%M) (Paris)"
            neuf=false
            tour
            if node tools/uefa/soir.mjs fini; then
              if [ "$confirme" = true ] && [ "$neuf" = false ]; then echo "Tout est à jour, confirmé dix minutes plus tard : fin de la veille."; break; fi
              confirme=true; echo "Tout paraît à jour : un tour de confirmation dans dix minutes."
            else confirme=false; fi
            if ! node tools/uefa/soir.mjs match; then echo "Pas un soir de match : un seul tour suffit."; break; fi
            if node tools/uefa/soir.mjs tot; then echo "Lancée en journée : un tour fait, la veille du soir partira toute seule."; break; fi
            if node tools/uefa/soir.mjs tard || [ $(date +%s) -ge $fin ]; then echo "Fin de la veille sans tout avoir : le passage du matin prendra le relais."; break; fi
            sleep 600
          done

      # ALARME DE PROJECTION. Le contrôle des matchs restants (projette.mjs) a vu
      # un écart : la projection n'a pas été mise à jour, mais la page, elle, est
      # publiée. On échoue ICI, en toute fin, pour que GitHub envoie son e-mail
      # « Run failed » sans avoir rien empêché.
      - name: Alarme de projection
        if: ${{ !cancelled() && steps.match.outputs.oui == 'true' }}
        run: |
          node -e "const fs=require('fs'),f=require('path').join(require('os').tmpdir(),'grotang-projection-bloquee.txt'); if(fs.existsSync(f)){console.log('::error::'+fs.readFileSync(f,'utf8').trim()); process.exit(1)} console.log('Controle des matchs restants : OK')"
