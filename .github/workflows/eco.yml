name: Rafraîchissement économie

# LA PAGE /economie/ SE MET À JOUR TOUTE SEULE (depuis le 25/10/2026).
#
# Eurostat publie les comptes publics par vagues : grands agrégats en avril et
# en octobre (notifications de déficit et de dette), ventilation par fonction
# (COFOG) et détail des impôts en début d'année. Un passage par semaine suffit
# largement : le lundi matin, hors des passages des robots UEFA et tennis.
# Une semaine sans publication, le passage relit, ne trouve rien de neuf et
# sort sans rien écrire.
#
# 23 06 UTC : la minute n'est jamais 00 (« High load times include the start of
# every hour »).
#
# Lancé à la main (« Run workflow ») : un passage tout de suite.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Écrire dans le dépôt, et appeler pages.yml (un push du robot ne le réveille
# pas : voir la note « POURQUOI DEUX DROITS » dans uefa.yml).
permissions:
  contents: write
  actions: write

concurrency:
  group: eco-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Relit Eurostat, contrôle les identités comptables (recettes = Σ
      # composantes, dépenses = Σ natures, solde = R − D, chaque fonction = Σ
      # sous-fonctions, détail des impôts = agrégat). Un seul contrôle en échec :
      # rien n'est écrit et le passage échoue (GitHub envoie son e-mail).
      - name: Relire Eurostat
        run: node tools/eco/refresh.mjs

      # Relit le fichier tel qu'il sera publié.
      - name: Test du fichier
        run: node tools/eco/test-eco.mjs

      - name: Déposer si quelque chose a changé
        id: depot
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/eco/data.json; then
            echo "Rien à déposer."
            exit 0
          fi
          git config user.name  "grotang.fr (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/eco/data.json
          git commit -m "Économie : comptes publics relus chez Eurostat ($(date -u +%d/%m))"
          # un autre robot peut avoir déposé entre-temps : on se recale et on réessaie
          git push || { git pull --rebase && git push; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Publier le site
        if: steps.depot.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
