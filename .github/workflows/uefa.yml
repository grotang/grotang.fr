name: Rafraîchissement UEFA

# LES PASSAGES À HEURE FIXE (le soir de match est couvert par uefa-soir.yml).
#
# Depuis le 14/10/2026, ce robot n'est plus celui sur qui on compte le soir. Les trois essais du
# soir partaient avec des heures de retard (le 13/10, celui de 23 h 38 est parti
# à 2 h 33) : GitHub ne garantit pas l'heure de départ d'une tâche planifiée.
# Le soir de match, c'est donc uefa-soir.yml qui travaille : il part tôt, reste
# éveillé de 20 h 35 jusqu'à ce que tout soit à jour, et publie au fil de l'eau.
#
# Ici restent deux passages le matin, en filet (si la veille du soir a manqué
# quelque chose) et pour l'alarme de fraîcheur, qui ne sonne qu'à 7 h.
#
# SEULEMENT LES LENDEMAINS DE MATCH (depuis le 30/10/2026). Avant : tous les
# jours, plus deux passages à 23 h 38 — environ 1 460 départs par an, dont
# l'immense majorité ne trouvait rien. Le calendrier de la saison 2026/27 compte
# 78 soirs de match : tous un mardi, mercredi ou jeudi, sauf la finale de la
# Ligue des champions (samedi 5 juin 2027). D'où :
#   - mercredi, jeudi, vendredi matin : lendemains des soirs de semaine ;
#   - dimanche matin en mai et juin : lendemain de la finale.
# Le passage de 23 h 38 est supprimé : la veille du soir (uefa-soir.yml) couvre
# déjà la soirée jusqu'à 3 h 30.
# Le signe de vie (plus bas) continue de tourner : il y a un passage chaque
# semaine, toute l'année.
#
# Cron ne parle qu'UTC et ignore le changement d'heure, d'où deux heures par
# rendez-vous :
#
#   12 05 UTC → 07 h 12 été · 06 h 12 hiver
#   12 06 UTC → 08 h 12 été · 07 h 12 hiver
#
# La minute n'est jamais 00 : « High load times include the start of every hour. »
#
# ON NE REPUBLIE QUE S'IL Y A DU NEUF : le script compare les chiffres à ceux
# déjà publiés et sort sans rien écrire s'ils n'ont pas bougé.
#
# Lancé à la main (« Run workflow ») : un passage tout de suite, à n'importe
# quelle heure ; la case « force » republie même sans données neuves.
on:
  schedule:
    - cron: '12 5,6 * * 3-5'     # mercredi → vendredi
    - cron: '12 5,6 * 5,6 0'     # dimanche, en mai et juin (lendemain de la finale de C1)
  workflow_dispatch:
    inputs:
      force:
        description: 'Republier même si les données sont inchangées'
        type: boolean
        default: false

# POURQUOI DEUX DROITS ET PAS UN.
#
# On a cru longtemps que déposer le commit suffisait : pages.yml écoute les push
# sur public/**, donc il devait publier tout seul. Il ne l'a jamais fait. Sur les
# quinze passages de pages.yml, aucun n'a été déclenché par le robot — tous
# venaient d'un push manuel ou d'un lancement à la main.
#
# La raison est une règle documentée de GitHub : « events triggered by the
# GITHUB_TOKEN will not create a new workflow run ». Un workflow ne peut pas en
# réveiller un autre par un simple push, sous peine de boucles infinies. Le push
# du robot arrive donc bien sur main, mais silencieusement : pages.yml ne le voit
# pas. Le site restait figé jusqu'au push manuel suivant.
#
# La règle a deux exceptions, dont `workflow_dispatch`. On appelle donc pages.yml
# explicitement, ce qui demande le droit `actions: write`. Pas de jeton personnel
# à créer, à stocker, ni à renouveler tous les six mois.
permissions:
  contents: write
  actions: write

concurrency:
  group: uefa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Garde-fou : la lecture des pages sources doit encore donner les mêmes
      # chiffres qu'un jeu validé à la main. Si la source change de forme, on
      # l'apprend ici et le rafraîchissement ne tourne même pas.
      - name: Contrôles sur capture de référence
        run: npm run test:extract

      # Aucun passage planifié n'est forcé : le script compare les chiffres à ceux
      # déjà publiés et sort sans rien écrire s'ils n'ont pas bougé. `--force` ne
      # sert qu'au lancement à la main, pour republier après une correction de
      # gabarit qui ne touche pas les données.
      # Chromium sert deux fois : a la projection, puis au test.
      - name: Navigateur
        timeout-minutes: 8
        run: bash tools/navigateur.sh

      - name: Relire la source et reconstruire
        id: refresh
        run: node tools/uefa/refresh.mjs ${{ inputs.force && '--force' || '' }}

      # public/ n'est plus dans le dépôt : sur une machine neuve il n'existe pas.
      # Le script ci-dessus ne le fabrique que s'il a trouvé du neuf ; la
      # projection et le test en ont besoin dans tous les cas.
      - name: Fabriquer la page
        run: node tools/build.mjs

      # LA PROJECTION. Elle tournait dans le navigateur de chaque visiteur, a
      # chaque ouverture : 2 000 saisons simulees, une seconde sur un poste fixe
      # et cinq a neuf sur un telephone, pour une erreur d'echantillonnage de un
      # dixieme de point. Elle tourne maintenant ICI, une fois, avec 200 000
      # saisons — trente-cinq secondes de runner, qui ne coutent rien — et la
      # page ne recoit plus que six nombres par nation et par horizon.
      #
      # Le modele n'est pas recopie : le script ouvre la page deja construite et
      # appelle son propre code de simulation. Une seule version du modele.
      # La graine reste la date des donnees : a donnees egales, meme resultat,
      # donc aucun commit parasite.
      - name: Projection sur le runner
        run: node tools/uefa/projette.mjs 200000


      # LE FILET. tools/uefa/test-page.mjs ouvre la page reconstruite dans un
      # vrai navigateur et vérifie une quinzaine de faits : pas d'erreur
      # JavaScript, tous les blocs remplis, aucun NaN affiché, et les égalités
      # qui doivent tomber (total 5 ans = somme des saisons, engagés − éliminés
      # = encore en lice).
      #
      # Placé ICI, entre la reconstruction et le dépôt : un échec bloquant
      # arrête le workflow avant le commit. Rien n'est publié, et le site
      # continue de servir la dernière version saine. Le pire scénario est un
      # site en retard — jamais un site cassé. L'horodatage en en-tête de page
      # le dit tout seul : il cesse d'avancer.
      - name: Test de non-régression
        run: node tools/uefa/test-page.mjs public/uefa/index.html

      - name: Déposer si quelque chose a changé
        id: depot
        run: |
          set -euo pipefail
          git config user.name  "grotang.fr (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            STAND=$(node -p "JSON.parse(require('fs').readFileSync('tools/uefa/page.html','utf8').split('/*DATA_START*/')[1].split('/*DATA_END*/')[0].replace(/^const D\s*=\s*/,'').replace(/;\s*$/,'')).meta.lastUpdated")
            # Deux natures de commit, deux messages. nations.json est réécrit à
            # l'identique quand la source n'a pas bougé : s'il est inchangé, le
            # seul écart vient de l'horodatage de publication. Le dire évite un
            # historique où « source arrêtée au 17/09 » revient tous les matins
            # alors que rien n'a changé depuis une semaine.
            if git diff --quiet HEAD -- tools/uefa/nations.json; then
              MSG="Republication quotidienne (source inchangée, arrêtée au $STAND)"
            else
              MSG="Coefficient UEFA : source arrêtée au $STAND"
            fi
            git add -A
            git commit -m "$MSG"
            git push || { git pull --rebase && git push; }
            echo "Déposé : $MSG"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rien de neuf côté source. Mais GitHub désactive les tâches planifiées
          # d'un dépôt public resté 60 jours sans activité — ce qui arriverait
          # pendant la trêve estivale, juste avant la reprise. On dépose donc une
          # trace au bout de 30 jours de silence : le compteur repart avec un mois
          # de marge, et le site publié ne change pas d'un octet.
          AGE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Rien à déposer. Dernier commit il y a $AGE jour(s)."
          if [ "$AGE" -ge 30 ]; then
            date -u +"Derniere verification de la source : %Y-%m-%d %H:%M UTC" > tools/uefa/last-checked.txt
            git add tools/uefa/last-checked.txt
            git commit -m "Signe de vie : source inchangée depuis $AGE jours"
            git push || { git pull --rebase && git push; }
            echo "Signe de vie déposé, la tâche planifiée reste active."
          fi

      # Le push ci-dessus ne réveille pas pages.yml (voir la note sur les droits).
      # On l'appelle donc nommément. `workflow_dispatch` est l'une des deux
      # exceptions à la règle : un lancement explicite part toujours, même
      # déclenché par le GITHUB_TOKEN.
      #
      # Conditionné au dépôt : un passage qui ne trouve rien de neuf ne republie
      # pas, et le signe de vie mensuel ne touche aucune source de la page —
      # inutile de déployer dans ces deux cas. C'est pages.yml qui fabrique et
      # publie le site, carte de partage comprise.
      - name: Publier le site
        if: steps.depot.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          echo "Publication demandée à pages.yml."

      # ALARME DE FRAÎCHEUR. Dernière étape, pour ne rien bloquer : si un soir de
      # Coupe d'Europe est passé et que la source n'a toujours pas bougé, le passage
      # de 7 h 12 (Paris) échoue ici, et GitHub envoie son e-mail « Run failed ».
      # Une seule alerte par jour ; les passages du soir ne sonnent jamais.
      - name: Alarme de fraîcheur
        run: node tools/uefa/fraicheur.mjs

      # ALARME DE PROJECTION. Le contrôle des matchs restants (projette.mjs) a vu
      # un écart : la projection n'a pas été mise à jour, mais la page, elle, est
      # publiée. On échoue ICI, en toute fin, pour que GitHub envoie son e-mail
      # « Run failed » sans avoir rien empêché.
      - name: Alarme de projection
        if: ${{ !cancelled() }}
        run: |
          node -e "const fs=require('fs'),f=require('path').join(require('os').tmpdir(),'grotang-projection-bloquee.txt'); if(fs.existsSync(f)){console.log('::error::'+fs.readFileSync(f,'utf8').trim()); process.exit(1)} console.log('Controle des matchs restants : OK')"
