name: Rafraîchissement UEFA

# Deux rendez-vous par jour, en heure de Paris :
#   23 h 38 — les matchs de C1, C3 et C4 sont finis, jahres a recalculé ;
#   07 h 12 — la page est fraîche avant le réveil.
#
# Mais cron ne parle qu'UTC et ignore le changement d'heure. Chaque rendez-vous
# demande donc deux lignes, une pour l'été et une pour l'hiver. Celle qui tombe à
# côté ne coûte rien : le script compare les chiffres à ceux déjà publiés et sort
# sans rien écrire s'ils n'ont pas bougé.
#
#   38 21 UTC → 23 h 38 été   ·   22 h 38 hiver
#   38 22 UTC → 00 h 38 été   ·   23 h 38 hiver
#   12 05 UTC → 07 h 12 été   ·   06 h 12 hiver
#   12 06 UTC → 08 h 12 été   ·   07 h 12 hiver
#
# En pratique ça donne deux tentatives le soir et deux le matin, quelle que soit
# la saison — un vrai filet, puisque GitHub prévient que « some queued jobs may be
# dropped » et qu'un passage a déjà été escamoté.
#
# La minute n'est jamais 00 : « High load times include the start of every hour. »
#
# ON NE REPUBLIE QUE S'IL Y A DU NEUF. Une republication quotidienne à vide a été
# essayée puis retirée : elle ne changeait qu'un horodatage et noyait l'historique.
# Le seul intérêt d'un passage est donc de déposer de vrais chiffres.
#
# Reste à ne pas rater le soir de match. Le risque n'est pas le script — il tourne
# en quinze secondes — mais GitHub, qui prévient que « some queued jobs may be
# dropped » et qui en a déjà escamoté. La parade est le nombre d'essais : trois
# dans l'heure qui suit la fin des matchs, puis deux le lendemain matin en filet.
# Un passage qui ne trouve rien de neuf sort sans rien écrire et ne coûte rien.
#
#   38 21 UTC → 23 h 38 été · 22 h 38 hiver   1er essai, les matchs viennent de finir
#   58 21 UTC → 23 h 58 été · 22 h 58 hiver   2e essai, vingt minutes plus tard
#   38 22 UTC → 00 h 38 été · 23 h 38 hiver   3e essai
#   12 05 UTC → 07 h 12 été · 06 h 12 hiver   filet du matin
#   12 06 UTC → 08 h 12 été · 07 h 12 hiver   filet du matin (heure d'hiver)
on:
  schedule:
    - cron: '38 21 * * *'
    - cron: '58 21 * * *'
    - cron: '38 22 * * *'
    - cron: '12 5 * * *'
    - cron: '12 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Republier même si les données sont inchangées'
        type: boolean
        default: false

# POURQUOI DEUX DROITS ET PAS UN.
#
# On a cru longtemps que déposer le commit suffisait : pages.yml écoute les push
# sur public/**, donc il devait publier tout seul. Il ne l'a jamais fait. Sur les
# quinze passages de pages.yml, aucun n'a été déclenché par le robot — tous
# venaient d'un push manuel ou d'un lancement à la main.
#
# La raison est une règle documentée de GitHub : « events triggered by the
# GITHUB_TOKEN will not create a new workflow run ». Un workflow ne peut pas en
# réveiller un autre par un simple push, sous peine de boucles infinies. Le push
# du robot arrive donc bien sur main, mais silencieusement : pages.yml ne le voit
# pas. Le site restait figé jusqu'au push manuel suivant.
#
# La règle a deux exceptions, dont `workflow_dispatch`. On appelle donc pages.yml
# explicitement, ce qui demande le droit `actions: write`. Pas de jeton personnel
# à créer, à stocker, ni à renouveler tous les six mois.
permissions:
  contents: write
  actions: write

concurrency:
  group: uefa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Garde-fou : la lecture des pages sources doit encore donner les mêmes
      # chiffres qu'un jeu validé à la main. Si la source change de forme, on
      # l'apprend ici et le rafraîchissement ne tourne même pas.
      - name: Contrôles sur capture de référence
        run: npm run test:extract

      # Aucun passage planifié n'est forcé : le script compare les chiffres à ceux
      # déjà publiés et sort sans rien écrire s'ils n'ont pas bougé. `--force` ne
      # sert qu'au lancement à la main, pour republier après une correction de
      # gabarit qui ne touche pas les données.
      - name: Relire la source et reconstruire
        id: refresh
        run: node tools/uefa/refresh.mjs ${{ inputs.force && '--force' || '' }}

      - name: Déposer si quelque chose a changé
        id: depot
        run: |
          set -euo pipefail
          git config user.name  "grotang.fr (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            STAND=$(node -p "JSON.parse(require('fs').readFileSync('tools/uefa/page.html','utf8').split('/*DATA_START*/')[1].split('/*DATA_END*/')[0].replace(/^const D\s*=\s*/,'').replace(/;\s*$/,'')).meta.lastUpdated")
            # Deux natures de commit, deux messages. nations.json est réécrit à
            # l'identique quand la source n'a pas bougé : s'il est inchangé, le
            # seul écart vient de l'horodatage de publication. Le dire évite un
            # historique où « source arrêtée au 17/09 » revient tous les matins
            # alors que rien n'a changé depuis une semaine.
            if git diff --quiet HEAD -- tools/uefa/nations.json; then
              MSG="Republication quotidienne (source inchangée, arrêtée au $STAND)"
            else
              MSG="Coefficient UEFA : source arrêtée au $STAND"
            fi
            git add -A
            git commit -m "$MSG"
            git push
            echo "Déposé : $MSG"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rien de neuf côté source. Mais GitHub désactive les tâches planifiées
          # d'un dépôt public resté 60 jours sans activité — ce qui arriverait
          # pendant la trêve estivale, juste avant la reprise. On dépose donc une
          # trace au bout de 30 jours de silence : le compteur repart avec un mois
          # de marge, et le site publié ne change pas d'un octet.
          AGE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Rien à déposer. Dernier commit il y a $AGE jour(s)."
          if [ "$AGE" -ge 30 ]; then
            date -u +"Derniere verification de la source : %Y-%m-%d %H:%M UTC" > tools/uefa/last-checked.txt
            git add tools/uefa/last-checked.txt
            git commit -m "Signe de vie : source inchangée depuis $AGE jours"
            git push
            echo "Signe de vie déposé, la tâche planifiée reste active."
          fi

      # Le push ci-dessus ne réveille pas pages.yml (voir la note sur les droits).
      # On l'appelle donc nommément. `workflow_dispatch` est l'une des deux
      # exceptions à la règle : un lancement explicite part toujours, même
      # déclenché par le GITHUB_TOKEN.
      #
      # Conditionné au dépôt : un passage qui ne trouve rien de neuf ne republie
      # pas, et le signe de vie mensuel ne touche pas public/ — inutile de
      # déployer dans ces deux cas.
      - name: Publier le site
        if: steps.depot.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          echo "Publication demandée à pages.yml."
