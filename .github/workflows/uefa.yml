name: Rafraîchissement UEFA

# Deux rendez-vous par jour, en heure de Paris :
#   23 h 38 — les matchs de C1, C3 et C4 sont finis, jahres a recalculé ;
#   07 h 12 — la page est fraîche avant le réveil.
#
# Mais cron ne parle qu'UTC et ignore le changement d'heure. Chaque rendez-vous
# demande donc deux lignes, une pour l'été et une pour l'hiver. Celle qui tombe à
# côté ne coûte rien : le script compare les chiffres à ceux déjà publiés et sort
# sans rien écrire s'ils n'ont pas bougé.
#
#   38 21 UTC → 23 h 38 été   ·   22 h 38 hiver
#   38 22 UTC → 00 h 38 été   ·   23 h 38 hiver
#   12 05 UTC → 07 h 12 été   ·   06 h 12 hiver
#   12 06 UTC → 08 h 12 été   ·   07 h 12 hiver
#
# En pratique ça donne deux tentatives le soir et deux le matin, quelle que soit
# la saison — un vrai filet, puisque GitHub prévient que « some queued jobs may be
# dropped » et qu'un passage a déjà été escamoté.
#
# La minute n'est jamais 00 : « High load times include the start of every hour. »
on:
  schedule:
    - cron: '38 21 * * *'
    - cron: '38 22 * * *'
    - cron: '12 5 * * *'
    - cron: '12 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Republier même si les données sont inchangées'
        type: boolean
        default: false

# Le seul droit nécessaire : écrire dans ce dépôt. Netlify prend le relais tout
# seul en voyant le commit.
permissions:
  contents: write

concurrency:
  group: uefa-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Garde-fou : la lecture des pages sources doit encore donner les mêmes
      # chiffres qu'un jeu validé à la main. Si la source change de forme, on
      # l'apprend ici et le rafraîchissement ne tourne même pas.
      - name: Contrôles sur capture de référence
        run: npm run test:extract

      - name: Relire la source et reconstruire
        id: refresh
        run: node tools/uefa/refresh.mjs ${{ inputs.force && '--force' || '' }}

      - name: Déposer si quelque chose a changé
        run: |
          set -euo pipefail
          git config user.name  "grotang.fr (robot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            STAND=$(node -p "JSON.parse(require('fs').readFileSync('tools/uefa/page.html','utf8').split('/*DATA_START*/')[1].split('/*DATA_END*/')[0].replace(/^const D\s*=\s*/,'').replace(/;\s*$/,'')).meta.lastUpdated")
            git add -A
            git commit -m "Coefficient UEFA : source arrêtée au $STAND"
            git push
            echo "Déposé. Netlify publie dans la minute."
            exit 0
          fi

          # Rien de neuf côté source. Mais GitHub désactive les tâches planifiées
          # d'un dépôt public resté 60 jours sans activité — ce qui arriverait
          # pendant la trêve estivale, juste avant la reprise. On dépose donc une
          # trace au bout de 30 jours de silence : le compteur repart avec un mois
          # de marge, et le site publié ne change pas d'un octet.
          AGE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Rien à déposer. Dernier commit il y a $AGE jour(s)."
          if [ "$AGE" -ge 30 ]; then
            date -u +"Derniere verification de la source : %Y-%m-%d %H:%M UTC" > tools/uefa/last-checked.txt
            git add tools/uefa/last-checked.txt
            git commit -m "Signe de vie : source inchangée depuis $AGE jours"
            git push
            echo "Signe de vie déposé, la tâche planifiée reste active."
          fi
