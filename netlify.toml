# grotang.fr — Netlify ne construit rien : il publie le dossier `public/` tel quel.
# Le site est généré en amont (tools/build.mjs) et le résultat est commité, donc
# un déploiement ne peut pas échouer pour une raison de build.

[build]
  publish = "public"
  command = ""
  # Depuis la tarification au crédit, un déploiement de production coûte 15 crédits
  # sur les 300 mensuels du plan gratuit — soit 20 déploiements par mois, et le site
  # est mis en pause au-delà. Or tous les commits ne changent pas le site publié :
  # le signe de vie mensuel, une correction d'outillage, une note dans le README.
  # Cette commande compare le commit publié au commit courant et, si rien n'a bougé
  # sous `public/` (ni la configuration elle-même), sort en 0 : Netlify saute la
  # construction. Sortie 1 = quelque chose a changé, on publie.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify.toml"


# L'apex est canonique ; www renvoie dessus.
[[redirects]]
  from = "https://www.grotang.fr/*"
  to = "https://grotang.fr/:splat"
  status = 301
  force = true

# Plus de page d'accueil : le site, c'est le coefficient UEFA. L'apex y mène
# directement, en 301 pour que l'autorité du domaine aille sur la page.
[[redirects]]
  from = "/"
  to = "/uefa/"
  status = 301

# Anciennes adresses : la page tennis vivait à la racine avant septembre 2026,
# et l'accueil a existé jusqu'à cette date.
[[redirects]]
  from = "/index.html"
  to = "/uefa/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Les pages sont régénérées chaque matin : on ne veut pas qu'un cache navigateur
# serve la version de la veille. Netlify garde son propre cache CDN, invalidé à
# chaque déploiement.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
